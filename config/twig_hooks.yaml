sylius_twig_hooks:
    hooks:
        'sylius_admin.monsieurbiz_sales_reports.index':
            sidebar:
                template: '@SyliusAdmin/shared/crud/common/sidebar.html.twig'
                priority: 200
            navbar:
                template: '@SyliusAdmin/shared/crud/common/navbar.html.twig'
                priority: 100
            content:
                template: '@SyliusAdmin/shared/crud/common/content.html.twig'
                priority: 0

        'sylius_admin.monsieurbiz_sales_reports.index.content':
            header:
                template: '@SyliusAdmin/shared/crud/common/content/header.html.twig'
                priority: 200
            grid:
                enabled: false
            day_form:
                template: '@MonsieurBizSyliusSalesReportsPlugin/admin/form.html.twig'
                priority: 100
            period_form:
                template: '@MonsieurBizSyliusSalesReportsPlugin/admin/form_period.html.twig'
                priority: 100


        'sylius_admin.monsieurbiz_sales_reports.index.content.header':
            breadcrumbs:
                enabled: false
            title_block:
                template: '@SyliusAdmin/shared/crud/common/content/header/title_block.html.twig'
                priority: 0

        'sylius_admin.monsieurbiz_sales_reports.index.content.header.title_block':
            title:
                template: '@SyliusAdmin/shared/crud/common/content/header/title_block/title.html.twig'
                configuration:
                    title: monsieurbiz.sales_reports.ui.title
                priority: 100
            actions:
                enabled: false

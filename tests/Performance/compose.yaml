services:
    database:
        image: mysql:8.0
        command:
            - --default-authentication-plugin=mysql_native_password
            - --skip-log-bin
            - --innodb-buffer-pool-size=536870912
            - --innodb-buffer-pool-instances=1
            - --tmp-table-size=16777216
            - --max-heap-table-size=16777216
        ports:
            - "127.0.0.1::3306"
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_DATABASE: sales_reports_benchmark
        volumes:
            - database:/var/lib/mysql
        mem_limit: 1g
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "--silent"]
            interval: 2s
            timeout: 2s
            retries: 60
            start_period: 10s

volumes:
    database: {}
